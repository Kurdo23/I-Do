services:
  # PostgreSQL Database (Primary)
  postgres:
    image: postgres:15-alpine
    container_name: ido-postgres
    environment:
      POSTGRES_DB: ido_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ido-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQL Server Database (Secondary)
# sqlserver:
#   image: mcr.microsoft.com/mssql/server:2022-latest
#   container_name: ido-sqlserver
#   environment:
#     SA_PASSWORD: "YourStrongPassword123!"
#     ACCEPT_EULA: "Y"
#     MSSQL_PID: "Express"
#   ports:
#     - "1433:1433"
#   volumes:
#     - sqlserver_data:/var/opt/mssql
#   networks:
#     - ido-network
#   healthcheck:
#     test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123! -Q 'SELECT 1' || exit 1"]
#     interval: 10s
#     timeout: 5s
#     retries: 5

  # .NET Core API
  api:
    build:
      context: ./backend/IDotAPI
      dockerfile: Dockerfile
    container_name: ido-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PostgreSQL=Server=postgres;Database=ido_db;User Id=postgres;Password=postgres;
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=ido_db;User Id=sa;Password=YourStrongPassword123!;
    depends_on:
      postgres:
        condition: service_healthy
      # sqlserver:
        # condition: service_healthy
    networks:
      - ido-network
    volumes:
      - ./backend/IDotAPI:/app

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ido-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_ENV=development
    depends_on:
      - api
    networks:
      - ido-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
    driver: local
  sqlserver_data:
    driver: local

networks:
  ido-network:
    driver: bridge